name: Build and Deploy SA-MP Server

on:
  push:
    branches: [ master ]
    paths:
      - 'gamemodes/*.pwn'
      - 'filterscripts/*.pwn'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install Pawn compiler
      run: |
        cd /tmp
        wget -q https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
        tar -xzf pawnc-3.10.10-linux.tar.gz
        
        # Находим папку, где лежит компилятор
        PAWNCC_DIR=$(dirname $(find /tmp -name "pawncc" -type f -executable 2>/dev/null | head -1))
        echo "Found compiler in: $PAWNCC_DIR"
        
        # Копируем исполняемый файл в системную папку
        sudo cp "$PAWNCC_DIR/pawncc" /usr/local/bin/
        
        # Копируем библиотеку .so в системную папку библиотек (если она есть в той же папке)
        if [ -f "$PAWNCC_DIR/libpawnc.so" ]; then
          sudo cp "$PAWNCC_DIR/libpawnc.so" /usr/local/lib/
        fi
        
        # Обновляем кэш разделяемых библиотек Linux
        sudo ldconfig
        
        # Проверяем, что всё работает
        pawncc -v
    
    - name: Compile gamemodes
      run: |
        cd gamemodes
        for file in *.pwn; do
          if [ -f "$file" ]; then
            pawncc "$file" -o "../gamemodes/${file%.pwn}.amx"
          fi
        done
    
    - name: Compile filterscripts
      run: |
        cd filterscripts
        for file in *.pwn; do
          if [ -f "$file" ]; then
            pawncc "$file" -o "../filterscripts/${file%.pwn}.amx"
          fi
        done
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /home/openmp/server
          git pull origin master
          docker restart samp_server
