name: Build and Deploy SA-MP Server

on:
  push:
    branches: [ master ]
    paths:
      - 'gamemodes/*.pwn'
      - 'filterscripts/*.pwn'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install Pawn compiler
      run: |
        cd /tmp
        wget -q https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
        tar -xzf pawnc-3.10.10-linux.tar.gz
        
        # 1. ПОКАЗЫВАЕМ СТРУКТУРУ (чтобы точно знать, что внутри)
        echo "=== Содержимое распакованной папки ==="
        ls -laR /tmp/pawnc-3.10.10-linux
        
        # 2. Ищем библиотеку .so во всей папке, а не только в bin
        SO_PATH=$(find /tmp/pawnc-3.10.10-linux -name "libpawnc.so" 2>/dev/null | head -1)
        echo "Найдена библиотека по пути: $SO_PATH"
        
        # 3. Копируем исполняемый файл
        sudo cp /tmp/pawnc-3.10.10-linux/bin/pawncc /usr/local/bin/
        
        # 4. Копируем библиотеку, если нашли
        if [ -n "$SO_PATH" ]; then
          sudo cp "$SO_PATH" /usr/local/lib/
          sudo ldconfig
          echo "Библиотека успешно скопирована и кэш обновлен."
        else
          echo "ВНИМАНИЕ: libpawnc.so не найдена в архиве!"
        fi
        
        # 5. ПРОВЕРЯЕМ зависимости перед запуском
        echo "=== Проверка зависимостей (ldd) ==="
        ldd /usr/local/bin/pawncc
        
        # 6. Запускаем
        pawncc -v
    
    - name: Compile gamemodes
      run: |
        cd gamemodes
        for file in *.pwn; do
          if [ -f "$file" ]; then
            pawncc "$file" -o "../gamemodes/${file%.pwn}.amx"
          fi
        done
    
    - name: Compile filterscripts
      run: |
        cd filterscripts
        for file in *.pwn; do
          if [ -f "$file" ]; then
            pawncc "$file" -o "../filterscripts/${file%.pwn}.amx"
          fi
        done
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /home/openmp/server
          git pull origin master
          docker restart samp_server
