name: Deploy SA-MP Server

on:
  push:
    branches: [ master ]
    paths:
      - 'gamemodes/*.amx'
      - 'filterscripts/*.amx'
      - 'server.cfg'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /home/openmp/server
          git pull origin master
          docker restart samp_server
